# 项目相关配置
erp:
  # 名称
  name: erp
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/erp/uploadPath，Linux配置 /home/erp/uploadPath）
  profile: G:/代码/ERP/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # 是否开启验证码（登录已取消验证码；注册等仍可按此开关）
  captchaEnabled: false
  # 是否开启用户注册（原 sys_config.sys.account.registerUser）
  registerUser: false
  # 用户初始密码（原 sys_config.sys.user.initPassword）
  initPassword: 123456
  # 初始密码强制修改 1强制 0不强制（原 sys.account.initPasswordModify）
  initPasswordModify: 0
  # 密码有效期天数 0不过期（原 sys.account.passwordValidateDays）
  passwordValidateDays: 0
  # 登录IP黑名单（原 sys.login.blackIPList）
  blackIPList:
  # Excel导入：是否允许部分成功入库（true=成功行入库；false=有失败则全部回滚不入库）
  importPartialCommit: false

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径（统一 /api 前缀，Controller 内不再重复写 /api）
    context-path: /api
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.erp: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置（与 server/.env REDIS_URL=redis://127.0.0.1:6379/0 对齐）
    redis:
      # 地址
      host: 127.0.0.1
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 6
      # 密码
      password:
      # 连接超时时间
      timeout: 15s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # accessToken 有效期（秒）：1 小时
  expireTime: 3600
  # refreshToken 有效期（天）：24 小时
  refreshExpireDays: 1

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.erp.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc OpenAPI 3
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    doc-expansion: none
    default-models-expand-depth: -1
  show-actuator: false
  packages-to-scan: com.erp.system.controller,com.erp.web.controller,com.erp.generator.controller
  paths-to-match: /**

# Knife4j 经典文档 UI（访问地址：/doc.html）
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表
    enable-search: true
    enable-footer: false
    enable-debug: true
    enable-open-api: true
    enable-home-custom: false
    enable-group: true

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
